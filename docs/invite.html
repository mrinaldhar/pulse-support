<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Join a Pulse home</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
           background: #f7f2ec; color: #211a1b; display: grid; place-items: center; min-height: 100vh; }
    main { background: #fffdf9; max-width: 420px; margin: 24px; padding: 32px 24px;
           border-radius: 28px; text-align: center; box-shadow: 0 16px 48px rgba(63,14,24,.14);
           border: 1px solid rgba(199,161,90,.35); }
    .icon { width: 82px; height: 82px; margin: 0 auto 20px; border-radius: 22px;
            background: linear-gradient(135deg, #3f0e18, #6b2233); display: grid; place-items: center;
            color: #c7a15a; font: 600 44px Georgia, serif; box-shadow: inset 0 0 0 2px rgba(199,161,90,.35); }
    h1 { font: 600 27px Georgia, serif; margin: 0 0 8px; }
    p { color: #6e5a5d; margin: 0 0 20px; }
    a.button { display: block; background: #6b2233; color: #fff7ec; text-decoration: none;
               font-weight: 600; padding: 15px 20px; border-radius: 14px; margin: 20px 0 12px; }
    code { font-size: 13px; color: #6e5a5d; word-break: break-all; }
    .note { font-size: 14px; margin-top: 22px; }
    @media (prefers-color-scheme: dark) {
      body { background: #14090c; color: #f7f2ec; }
      main { background: #211a1b; border-color: rgba(199,161,90,.25); }
      p, code { color: #c5b6b7; }
    }
  </style>
</head>
<body>
<main>
  <div class="icon">P</div>
  <h1>Join a Pulse home</h1>
  <p>Someone shared their home with you. Open Pulse to see the invite and join.</p>
  <a class="button" id="open" href="pulse://invite">Open Pulse</a>
  <p class="note">If the button does nothing, install the latest TestFlight build first, then try again.</p>
  <code id="code"></code>
</main>
<script>
  const code = new URLSearchParams(location.search).get("code");
  if (code) {
    const link = document.getElementById("open");
    link.href = "pulse://invite?code=" + encodeURIComponent(code);
    document.getElementById("code").textContent = "Invite code: " + code;
  }
</script>
</body>
</html>
